name: Sync MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual sync"
        required: false
        default: "Manual trigger"

jobs:
  sync:
    name: Trigger Akto MCP Registry Sync
    runs-on: ubuntu-latest
    environment: Akto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for raw.githubusercontent.com to reflect latest commit
        run: |
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/mcp-allowlist.csv"
          LOCAL_HASH=$(sha256sum mcp-allowlist.csv | awk '{print $1}')
          echo "Local hash : $LOCAL_HASH"

          for i in $(seq 1 60); do
            REMOTE_HASH=$(curl -sf "$RAW_URL" | sha256sum | awk '{print $1}')
            echo "Attempt $i — remote hash: $REMOTE_HASH"
            if [ "$REMOTE_HASH" = "$LOCAL_HASH" ]; then
              echo "Raw URL is up to date."
              exit 0
            fi
            sleep 10
          done

          echo "Raw URL did not reflect latest commit after 600s. Aborting."
          exit 1

      - name: Sync registry with Akto
        run: |
          response=$(curl -s -o /tmp/response_body.txt -w "%{http_code}" \
            -X POST "${{ vars.AKTO_URL }}/api/syncMcpRegistry" \
            -H "X-API-KEY: ${{ secrets.AKTO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"registryId\": \"${{ vars.AKTO_REGISTRY_ID }}\"}")

          body=$(cat /tmp/response_body.txt)
          echo "HTTP status : $response"
          echo "Response    : $body"

          if [ "$response" -ne 200 ]; then
            echo "Sync failed."
            exit 1
          fi

          echo "MCP registry synced successfully."
